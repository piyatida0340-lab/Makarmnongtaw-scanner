<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makarmnongtaw Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#171717}
.wrap{max-width:760px;margin:auto;padding:20px}
.card{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:28px}.sub{color:#666;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
label{font-size:14px;font-weight:750}
input{width:100%;margin-top:6px;padding:14px;border:1px solid #ddd;border-radius:13px;font-size:18px}
button{width:100%;border:0;border-radius:15px;padding:16px;background:#111;color:#fff;font-size:18px;font-weight:800;margin-top:18px}
.clear{background:#eee;color:#222;margin-top:10px}
.error{display:none;background:#ffe4e4;color:#a40000;border-radius:15px;padding:15px;margin-top:15px;font-weight:700;line-height:1.5}
.result{text-align:center;display:none}
.status{display:inline-block;padding:10px 18px;border-radius:999px;font-weight:900;font-size:18px}
.darkgreen{background:#b7e4c7;color:#075b2a}
.lightgreen{background:#dcfce7;color:#15803d}
.orange{background:#ffe5cc;color:#b45309}
.red{background:#ffdede;color:#b42318}
.score{font-size:52px;font-weight:900;line-height:1;margin:12px 0}
.percent{color:#666}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.stat{background:#f6f7f9;border-radius:15px;padding:16px}
.stat b{display:block;font-size:27px;margin-top:5px}
.small{color:#777;font-size:13px}
@media(max-width:560px){.grid,.stats{grid-template-columns:1fr}}
</style>

<style>
.brand-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 10px;
}
.brand-logo{
  width:52px;
  height:52px;
  min-width:52px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
@media (max-width:480px){
  .brand-logo{
    width:48px;
    height:48px;
    min-width:48px;
  }
  .brand-title{
    gap:10px;
  }
}
</style>

  }

  const efficiency=o7/c7;
  const avgCreator7=c30/30*7;
  const momentumRatio=c7/avgCreator7;
  const momentumPct=momentumRatio*100;
  const score=efficiency*(1+(momentumRatio-1)*0.5);
  const scorePct=score/3*100;

  let cls,label;
  if(score>=3){cls="darkgreen";label="🟢 ≥ 3.00 = ทองคำ / เข้าด่วนเลยเพ่"}
  else if(score>=2.5){cls="lightgreen";label="🟩 2.50–2.99 = ไฟเขียวอ่อน / เล่นได้ ตลาดเปิด"}
  else if(score>=1){cls="orange";label="🟠 1.00–2.49 = ไฟส้ม / ลองเบาๆ ก่อน"}
  else{cls="red";label="🔴 < 1.00 = ไฟแดง / อย่าเลย"}

  const status=document.getElementById("status");
  status.className="status "+cls;
  status.textContent=label;
  document.getElementById("score").textContent=fmt(score)+"/3";
  document.getElementById("percent").textContent="เทียบเกณฑ์ 3 = "+fmt(scorePct,1)+"%";
  document.getElementById("eff").textContent=fmt(efficiency);
  document.getElementById("mom").textContent=fmt(momentumPct,1)+"%";
  document.getElementById("showO7").textContent=o7.toLocaleString();
  document.getElementById("showC7").textContent=c7.toLocaleString();
  document.getElementById("result").style.display="block";
}

function clearAll(){
  ["o7","c7","o30","c30"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("error").style.display="none";
  document.getElementById("result").style.display="none";
}
</script>
</body>
</html>
